# Local development với PostgreSQL local (không cần Neon)
# Chạy: docker compose -f docker-compose.dev.yml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vodongha-app-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=vodongha;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vodongha-net

  db:
    image: postgres:16-alpine
    container_name: vodongha-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vodongha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vodongha-net

networks:
  vodongha-net:
    driver: bridge

volumes:
  pgdata:
