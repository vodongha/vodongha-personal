services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Real version stamped into the assembly (footer/health read it). The deploy
        # webhook sets APP_VERSION from `git describe`; falls back to 0.0.0 locally.
        APP_VERSION: "${APP_VERSION:-0.0.0}"
    container_name: vodongha-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      # Oracle ADB wallet (mTLS). sqlnet.ora inside points WALLET_LOCATION at /app/wallet.
      - TNS_ADMIN=/app/wallet
    env_file:
      - .env
    volumes:
      # Unzipped ADB wallet (git-ignored, present on the host). Read-only.
      - ./wallet:/app/wallet:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - vodongha-net

networks:
  vodongha-net:
    driver: bridge
