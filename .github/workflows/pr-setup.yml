name: PR Auto Setup

on:
  pull_request:
    types: [opened, reopened]

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Auto-assign creator, add label & milestone
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            // 1. Assignee = PR creator
            await github.rest.issues.addAssignees({
              owner, repo, issue_number,
              assignees: [pr.user.login]
            });

            // 2. Label based on branch name
            const branch = pr.head.ref;
            const labels = ['needs-review'];
            if (branch.startsWith('feature/'))     labels.push('enhancement');
            else if (branch.startsWith('bugfix/')) labels.push('bug');
            else if (branch.startsWith('docs/'))   labels.push('documentation');
            else if (branch.startsWith('style/'))  labels.push('style');
            else if (branch.startsWith('ci/'))     labels.push('ci');

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels });

            // 3. Milestone
            await github.rest.issues.update({
              owner, repo, issue_number,
              milestone: 1
            });

      - name: Request reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const creator = context.payload.pull_request.user.login;

            const reviewers = ['vodongha', 'copilot'].filter(r => r !== creator);

            try {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number, reviewers
              });
              console.log('Reviewers requested:', reviewers);
            } catch (e) {
              console.log('Could not request some reviewers:', e.message);
            }
