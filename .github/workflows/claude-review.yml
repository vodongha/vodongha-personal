name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - master

jobs:
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review & Auto-merge
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are a code reviewer for the personal website vodongha.id.vn (Blazor .NET 10 + PostgreSQL + SCSS).

            Review this pull request using the checklist in CLAUDE.md. Be concise — bullet points only.

            Check:
            - No secrets or connection strings committed
            - SCSS compiles to wwwroot/app.css (no stray main.css)
            - Blazor components with logic have .razor.cs code-behind
            - DB code is fully async (no .Result / .Wait())
            - EF migrations are additive only
            - IDbContextFactory used in services
            - No raw SQL in application code

            If all checks pass, post a short approval comment and run:
              gh pr merge --merge --auto

            If there are issues, list them clearly and do NOT merge.
