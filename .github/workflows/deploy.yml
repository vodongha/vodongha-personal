name: CI & Deploy

on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet build VodonghaPersonal.slnx --no-restore --configuration Release

  dotnet-format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet format VodonghaPersonal.slnx --verify-no-changes --severity warn

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet test VodonghaPersonal.slnx --no-restore --verbosity minimal

  js-scss-lint:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint:js
      - run: npm run lint:scss

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [build, test, dotnet-format, js-scss-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Resolve app version from git tag
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v[0-9]' | head -1)
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
            echo "has_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "has_tag=false" >> $GITHUB_OUTPUT
          fi
      - run: flyctl deploy --remote-only --app vodongha --build-arg APP_VERSION=${{ steps.version.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Persist version as Fly.io secret
        if: steps.version.outputs.has_tag == 'true'
        run: flyctl secrets set APP_VERSION=${{ steps.version.outputs.version }} --app vodongha
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
