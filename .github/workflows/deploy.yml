name: CI & Deploy

on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet build VodonghaPersonal.slnx --no-restore --configuration Release

  dotnet-format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet format VodonghaPersonal.slnx --verify-no-changes --severity warn

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore VodonghaPersonal.slnx
      - run: dotnet test VodonghaPersonal.slnx --no-restore --verbosity minimal

  js-scss-lint:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint:js
      - run: npm run lint:scss

  deploy:
    name: Deploy to home server
    runs-on: ubuntu-latest
    needs: [build, test, dotnet-format, js-scss-lint]
    steps:
      - name: Trigger home-server deploy (Cloudflare Tunnel webhook)
        run: |
          curl -fsS --max-time 30 -X POST https://hooks.vodongha.id.vn/deploy/vodongha-personal \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}"
